name: Profile metrics

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/metrics.yml]

permissions:
  contents: write

# PRIVACY: this repo is public, so metrics/*.svg are public.
# scripts/generate_metrics.py only ever renders aggregate numbers and language
# names — it never touches repository names, descriptions, or commit messages.
# The METRICS_TOKEN secret is used inside the runner only and is never written out.

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate metric cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}   # classic PAT: repo + read:user
          METRICS_TZ: Africa/Cairo
        run: python scripts/generate_metrics.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/*.svg
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: refresh profile metrics [skip ci]"
          git push
